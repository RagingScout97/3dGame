<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
        }

        /* ================================================================
           UI/HUD STYLING
           ================================================================ */
        
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Don't block mouse clicks */
            z-index: 1000;
        }

        /* Crosshair (center of screen) */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 12px;
            top: 4px;
            left: 9px;
        }
        #crosshair::after {
            width: 12px;
            height: 2px;
            top: 9px;
            left: 4px;
        }

        /* Health Bar (top left) */
        #health-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
        }
        #health-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #health-bar-bg {
            width: 100%;
            height: 20px;
            background: rgba(50, 50, 50, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        #health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff4444);
            width: 100%;
            transition: width 0.2s ease;
        }

        /* Ammo Counter (bottom right) */
        #ammo-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
        }
        #ammo-current {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        #ammo-total {
            font-size: 24px;
            color: #aaa;
            margin-left: 10px;
        }

        /* Score (top right) */
        #score-container {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }
        #score-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #score-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* FPS Counter (top center) */
        #fps-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        #fps-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        #fps-value {
            font-size: 24px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* UI Toggle Indicator (bottom left) */
        #ui-toggle-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }

        /* Hide UI when toggled off */
        #hud.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- UI/HUD Overlay -->
    <div id="hud">
        <!-- Crosshair -->
        <div id="crosshair"></div>
        
        <!-- Health Bar (top left) -->
        <div id="health-container">
            <div id="health-label">HEALTH</div>
            <div id="health-bar-bg">
                <div id="health-bar-fill"></div>
            </div>
        </div>
        
        <!-- Score (top right) -->
        <div id="score-container">
            <div id="score-label">SCORE</div>
            <div id="score-value">0</div>
        </div>
        
        <!-- FPS Counter (top center) -->
        <div id="fps-container">
            <div id="fps-label">FPS</div>
            <div id="fps-value">60</div>
        </div>
        
        <!-- Ammo Counter (bottom right) -->
        <div id="ammo-container">
            <div id="ammo-current">30</div>
            <div id="ammo-total">/ 90</div>
        </div>
        
        <!-- UI Toggle Hint (bottom left) -->
        <div id="ui-toggle-hint">Press H to toggle UI</div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
